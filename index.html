<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAN-13 Barcode Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
<div class="max-w-2xl mx-auto">
  <div class="bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">EAN-13 Barcode Generator</h1>
    <p class="text-gray-500 text-sm mb-6">Enter 12 digits — the check digit is calculated automatically.</p>
    <div class="mb-4">
      <label for="digits" class="block text-sm font-medium text-gray-700 mb-1">12-Digit Number</label>
      <input id="digits" type="text" maxlength="12" placeholder="e.g. 590123412345"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 text-lg font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <p id="error" class="text-red-500 text-sm mt-1 hidden"></p>
    </div>
    <button id="generateBtn"
      class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2 rounded-lg transition mb-6">
      Generate Barcode
    </button>
    <div id="output" class="hidden">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-medium text-gray-600">EAN-13 Barcode</span>
        <button id="copyBtn"
          class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded-lg transition font-medium">
          Copy SVG
        </button>
      </div>
      <div id="barcodeContainer" class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col items-center overflow-x-auto"></div>
      <div class="mt-4 bg-gray-50 rounded-xl p-4">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Structure</p>
        <div id="structureInfo" class="grid grid-cols-2 gap-2 text-sm text-gray-700"></div>
      </div>
      <div class="mt-4 bg-indigo-50 rounded-xl p-4">
        <p class="text-xs font-semibold text-indigo-600 uppercase tracking-wider mb-2">Check Digit Formula</p>
        <div id="checkFormula" class="text-sm text-gray-700 font-mono leading-relaxed"></div>
      </div>
    </div>
  </div>
</div>
<script>
const L_CODES = {
  0:'0001101',1:'0011001',2:'0010011',3:'0111101',4:'0100011',
  5:'0110001',6:'0101111',7:'0111011',8:'0110111',9:'0001011'
};
const G_CODES = {
  0:'0100111',1:'0110011',2:'0011011',3:'0100001',4:'0011101',
  5:'0111001',6:'0000101',7:'0010001',8:'0001001',9:'0010111'
};
const R_CODES = {
  0:'1110010',1:'1100110',2:'1101100',3:'1000010',4:'1011100',
  5:'1001110',6:'1010000',7:'1000100',8:'1001000',9:'1110100'
};
const FIRST_DIGIT_PARITY = [
  'LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG',
  'LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'
];

function calcCheckDigit(d12) {
  let sum = 0;
  for (let i = 0; i < 12; i++) {
    sum += parseInt(d12[i]) * (i % 2 === 0 ? 1 : 3);
  }
  return (10 - (sum % 10)) % 10;
}

function encode(d13) {
  const first = parseInt(d13[0]);
  const parity = FIRST_DIGIT_PARITY[first];
  let bits = '101';
  for (let i = 1; i <= 6; i++) {
    const d = parseInt(d13[i]);
    bits += parity[i-1] === 'L' ? L_CODES[d] : G_CODES[d];
  }
  bits += '01010';
  for (let i = 7; i <= 12; i++) {
    bits += R_CODES[parseInt(d13[i])];
  }
  bits += '101';
  return bits;
}

function renderBarcode(d13) {
  const bits = encode(d13);
  const barW = 2;
  const quietZone = 10;
  const totalW = quietZone * 2 + bits.length * barW;
  const barcodeH = 80;
  const textH = 14;
  const svgH = barcodeH + textH + 6;

  let rects = '';
  let i = 0;
  while (i < bits.length) {
    if (bits[i] === '1') {
      let j = i;
      while (j < bits.length && bits[j] === '1') j++;
      const x = quietZone + i * barW;
      const w = (j - i) * barW;
      rects += `<rect x="${x}" y="0" width="${w}" height="${barcodeH}" fill="black"/>`;
      i = j;
    } else {
      i++;
    }
  }

  const leftText = d13.slice(1, 7);
  const rightText = d13.slice(7, 13);
  const firstCharX = quietZone - 8;
  const leftTextX = quietZone + 3 * barW + 7 * barW * 0.5 + 3;
  const rightTextX = quietZone + (3 + 7*6 + 5) * barW + 7 * barW * 0.5 + 3;

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${svgH}" viewBox="0 0 ${totalW} ${svgH}">
<rect width="${totalW}" height="${svgH}" fill="white"/>
${rects}
<text x="${firstCharX}" y="${barcodeH + textH - 2}" font-family="monospace" font-size="10" fill="black">${d13[0]}</text>
<text x="${leftTextX}" y="${barcodeH + textH - 2}" font-family="monospace" font-size="10" fill="black" text-anchor="middle">${leftText}</text>
<text x="${rightTextX}" y="${barcodeH + textH - 2}" font-family="monospace" font-size="10" fill="black" text-anchor="middle">${rightText}</text>
</svg>`;
  return svg;
}

function showCheckFormula(d12, check) {
  let odd = [], even = [], oddSum = 0, evenSum = 0;
  for (let i = 0; i < 12; i++) {
    const v = parseInt(d12[i]);
    if (i % 2 === 0) { odd.push(v); oddSum += v; }
    else { even.push(v); evenSum += v * 3; }
  }
  const total = oddSum + evenSum;
  const remainder = total % 10;
  return `Odd positions (×1): ${odd.join(' + ')} = ${oddSum}<br>
Even positions (×3): ${even.map(v=>v+'×3').join(' + ')} = ${evenSum}<br>
Total: ${oddSum} + ${evenSum} = ${total}<br>
10 − (${total} mod 10) = 10 − ${remainder} = <strong>${check}</strong>`;
}

document.getElementById('generateBtn').addEventListener('click', () => {
  const val = document.getElementById('digits').value.trim();
  const errEl = document.getElementById('error');
  errEl.classList.add('hidden');
  if (!/^\d{12}$/.test(val)) {
    errEl.textContent = 'Please enter exactly 12 numeric digits.';
    errEl.classList.remove('hidden');
    document.getElementById('output').classList.add('hidden');
    return;
  }
  const check = calcCheckDigit(val);
  const d13 = val + check;
  const svg = renderBarcode(d13);
  const container = document.getElementById('barcodeContainer');
  container.innerHTML = svg;
  document.getElementById('structureInfo').innerHTML = `
    <div><span class="font-semibold">Full Code:</span> ${d13}</div>
    <div><span class="font-semibold">Check Digit:</span> ${check}</div>
    <div><span class="font-semibold">Country/Prefix:</span> ${d13.slice(0,3)}</div>
    <div><span class="font-semibold">Manufacturer:</span> ${d13.slice(3,7)}</div>
    <div><span class="font-semibold">Product:</span> ${d13.slice(7,12)}</div>
    <div><span class="font-semibold">Guards:</span> 101 … 01010 … 101</div>`;
  document.getElementById('checkFormula').innerHTML = showCheckFormula(val, check);
  document.getElementById('output').classList.remove('hidden');
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const svg = document.getElementById('barcodeContainer').querySelector('svg');
  if (!svg) return;
  navigator.clipboard.writeText(svg.outerHTML).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy SVG', 2000);
  });
});

document.getElementById('digits').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('generateBtn').click();
});
</script>
</body>
</html>
